name: Project checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
  deploy:
    name: Firebase production
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    env:
      FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXO_LIFE_3D_MATEO }}
    steps:
      - name: Check deployment authorization
        if: env.FIREBASE_CREDENTIAL == ''
        run: echo '::warning::Firebase deployment is pending authorization. Configure the repository secret described in docs/GITHUB.md.'
      - uses: actions/checkout@v4
        if: env.FIREBASE_CREDENTIAL != ''
      - uses: actions/setup-node@v4
        if: env.FIREBASE_CREDENTIAL != ''
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
        if: env.FIREBASE_CREDENTIAL != ''
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.FIREBASE_CREDENTIAL != ''
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXO_LIFE_3D_MATEO }}
          projectId: nexo-life-3d-mateo
          channelId: live
